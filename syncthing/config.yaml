# https://developers.home-assistant.io/docs/apps/configuration
name: Syncthing
version: "1.0.0"
slug: syncthing
description: >-
  Continuous file synchronisation with your other machines. The device identity
  can be pinned from the add-on options, so a NixOS or nix-darwin flake can
  declare this instance as a peer before it has ever been started.
url: https://syncthing.net/
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8384
panel_title: Syncthing
panel_icon: mdi:sync
ports:
  "22000/tcp": 22000
  "22000/udp": 22000
  "21027/udp": 21027
ports_description:
  "22000/tcp": Sync protocol (TCP). Forward this port if you sync over the internet.
  "22000/udp": Sync protocol (QUIC). Same port as TCP, used when QUIC works better.
  "21027/udp": Local discovery announcements.
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: homeassistant_config
    read_only: false
  - type: addon_config
    read_only: false
  - type: backup
    read_only: false
options:
  device_name: homeassistant
  folder_root: /share/syncthing
  cert_pem: ""
  key_pem: ""
  peers: []
  folders: []
  override_devices: false
  override_folders: false
  gui_user: ""
  gui_password: ""
  local_discovery: true
  global_discovery: true
  relays_enabled: true
  nat_traversal: true
schema:
  device_name: str
  folder_root: str
  cert_pem: str?
  key_pem: str?
  peers:
    - id: match(^[A-Z2-7]{7}(-[A-Z2-7]{7}){7}$)
      name: str?
      addresses:
        - str?
      introducer: bool?
      auto_accept_folders: bool?
      compression: list(metadata|always|never)?
      untrusted: bool?
      paused: bool?
  folders:
    - id: str
      label: str?
      path: str
      type: list(sendreceive|sendonly|receiveonly|receiveencrypted)?
      devices:
        - str?
      rescan_interval: int?
      fs_watcher: bool?
      ignore_perms: bool?
      versioning: list(none|trashcan|simple|staggered)?
      versioning_param: int?
  override_devices: bool
  override_folders: bool
  gui_user: str?
  gui_password: str?
  local_discovery: bool
  global_discovery: bool
  relays_enabled: bool
  nat_traversal: bool
