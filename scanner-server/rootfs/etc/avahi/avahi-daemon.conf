# Avahi configuration for the Scanner Server add-on.
#
# The add-on runs on the host network, so this daemon shares the host's mDNS
# responder duties. It publishes nothing by itself: AirSane registers the
# _uscan._tcp / _uscans._tcp records over D-Bus once it knows which scanners
# exist.

[server]
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
# Neither record is useful here and both collide with whatever else already
# announces the host (the CUPS add-on, the host's own responder).
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=no

[rlimits]
rlimit-nproc=16
