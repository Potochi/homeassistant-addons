# Avahi configuration for the Scanner Server add-on.
#
# host-name is rewritten at start-up by scanner-setup to the Home Assistant
# host's own name. It matters because this daemon runs inside the add-on
# container, where gethostname() returns the container name
# ("<hash>-scanner-server"). Publishing under that name puts it in the SRV
# record of the scanner service, and no client on the network can resolve it -
# macOS finds the scanner, then hangs the moment you open it. The value below
# is only a fallback for the case where the Supervisor cannot be reached.
#
# The add-on runs on the host network, so this daemon shares the LAN with
# whatever mDNS responder the host is already running.

[server]
host-name=homeassistant
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
# The host already answers for its own name; claiming it a second time from in
# here would lose the conflict and get us renamed to "<name>-2", which is the
# unresolvable situation all over again. Publishing no addresses means this
# daemon never probes for the name, so it keeps using it verbatim in SRV
# records while the host keeps serving the A/AAAA records for it.
publish-addresses=no
# Neither record is useful here and both collide with whatever else already
# announces the host (the CUPS add-on, the host's own responder).
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=no

[rlimits]
rlimit-nproc=16
